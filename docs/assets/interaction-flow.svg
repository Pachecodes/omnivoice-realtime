<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">OmniVoice integration flow</title><desc id="desc">A Studio or API client sends text to local FastAPI. Explicit mock mode generates tones; a separately installed upstream engine can generate speech. Completed audio chunks return as JSON base64. Optional consented reference uploads persist locally.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#85a5c9"/></marker></defs><rect width="1200" height="600" rx="24" fill="#161328"/><text x="40" y="55" font-family="sans-serif" font-size="17" font-weight="600" fill="#d5b5ff">OMNIVOICE / INTERACTION DIAGRAM</text><text x="40" y="105" font-family="sans-serif" font-size="34" font-weight="600" fill="#e9eef7">One local API. Two clearly different engines.</text><text x="40" y="140" font-family="sans-serif" font-size="20" font-weight="400" fill="#c5d2e6">Transport integration, not a new speech model · Single operator · One worker</text><rect x="40" y="220" width="250" height="110" rx="14" fill="#152236" stroke="#d5b5ff" stroke-width="2"/><text x="60" y="257" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">Studio / API client</text><text x="60" y="289" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Send text or a batch</text><rect x="350" y="220" width="250" height="110" rx="14" fill="#152236" stroke="#d5b5ff" stroke-width="2"/><text x="370" y="257" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">Local FastAPI</text><text x="370" y="289" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">REST or WebSocket</text><path d="M290 275 L350 275" stroke="#85a5c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 275 H645 V225 H690 M645 275 V385 H690" stroke="#85a5c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M645 225 L690 225" stroke="#85a5c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="690" y="170" width="470" height="110" rx="14" fill="#152236" stroke="#f3c475" stroke-width="2"/><text x="710" y="207" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">Explicit mock mode</text><text x="710" y="239" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Deterministic test tones · Not speech</text><rect x="690" y="330" width="470" height="110" rx="14" fill="#152236" stroke="#d5b5ff" stroke-width="2"/><text x="710" y="367" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">Optional upstream model</text><text x="710" y="399" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Real speech requires separate installation</text><text x="40" y="395" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">Consented voice references</text><text x="40" y="427" font-family="sans-serif" font-size="18" font-weight="400" fill="#c5d2e6">Optional upload → local disk registry → warm cache</text><text x="40" y="495" font-family="sans-serif" font-size="23" font-weight="600" fill="#e9eef7">Return path: completed audio chunks → JSON / base64 → client playback</text><text x="40" y="535" font-family="sans-serif" font-size="20" font-weight="400" fill="#f3c475">Each chunk is generated fully before sending. Not token-level streaming or full duplex.</text><text x="40" y="573" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Diagram only · Real synthesis and GPU/MPS/CPU model execution are unverified in this release</text></svg>
