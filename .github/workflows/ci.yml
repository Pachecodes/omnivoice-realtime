name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest -q
      - run: node --test tests/pro_clone_regression.cjs
      - run: python -m build
      - name: Isolated wheel smoke (mock, no weights)
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl httpx
          cd "$RUNNER_TEMP"
          OMNIVOICE_MOCK=1 OMNIVOICE_UPLOAD_DIR="$RUNNER_TEMP/voices" OMNIVOICE_ALLOWED_HOSTS=testserver "$RUNNER_TEMP/wheel-env/bin/python" -c 'from fastapi.testclient import TestClient; from omnivoice_realtime.main import app; c=TestClient(app); assert c.get("/health").json()["engine"] == "mock"; assert c.get("/ui/pro").status_code == 200; assert c.post("/v1/tts",json={"text":"test"}).status_code == 200'
